            <!-- Bong bóng hội thoại AI Chat & RAG -->
            <div id="speech-bubble" class="bubble">
                <div class="bubble-header" data-drag="true">
                    <!-- Nhóm trái: ghim trên cùng → tiêu đề. Kéo vùng này để di chuyển cửa sổ. -->
                    <div class="header-left">
                        <button
                            id="btn-always-on-top"
                            class="icon-btn active"
                            title="Ghim trên cùng màn hình (Always on Top)"
                        >
                            📌
                        </button>
                        <div class="header-title-block">
                            <div class="app-title">
                                BamAI
                                <span class="app-title-sub">Offline AI</span>
                            </div>
                            <div class="status-text" id="status-label">
                                Sẵn sàng phục vụ
                            </div>
                        </div>
                    </div>
                    <div class="window-controls">
                        <button
                            id="btn-new-chat"
                            class="icon-btn"
                            title="Tạo phiên hỏi đáp mới"
                        >
                            ＋
                        </button>
                        <button
                            id="btn-recent-chat"
                            class="icon-btn"
                            title="Mở lại hội thoại gần đây"
                        >
                            🕘
                        </button>
                        <button
                            id="btn-settings"
                            class="icon-btn"
                            title="Thiết lập BamAI"
                        >
                            ⚙️
                        </button>
                        <button
                            id="btn-stop-stream"
                            class="icon-btn stop-btn hidden"
                            title="Dừng câu trả lời"
                        >
                            ⏹
                        </button>
                        <button
                            id="btn-minimize"
                            class="icon-btn"
                            title="Thu nhỏ bong bóng"
                        >
                            −
                        </button>
                        <button
                            id="btn-close"
                            class="icon-btn close-btn"
                            title="Đóng ứng dụng và tắt toàn bộ dịch vụ AI/RAG"
                        >
                            ×
                        </button>
                    </div>
                </div>

                <!-- Thanh bối cảnh Cục Xương (Directory Context Bar) -->
                <div id="bone-context-bar" class="bone-context-bar hidden">
                    <div class="bone-context-info">
                        <span class="bone-icon">🍖</span>
                        <span class="bone-text" id="bone-dir-text"
                            >/etc/nixos</span
                        >
                    </div>
                    <button
                        id="btn-clear-bone"
                        class="bone-clear-btn"
                        title="Gỡ bỏ bối cảnh thư mục"
                    >
                        ×
                    </button>
                </div>

                <!-- Thanh xem trước tài liệu/hình ảnh đính kèm (+) -->
                <div
                    id="attached-preview-bar"
                    class="attached-preview-bar hidden"
                >
                    <div class="attached-tag">
                        <span id="attached-icon">📎</span>
                        <span id="attached-filename" class="attached-filename"
                            >tailieu.pdf</span
                        >
                    </div>
                    <button
                        id="btn-remove-attachment"
                        class="remove-attachment-btn"
                        title="Gỡ đính kèm"
                    >
                        ×
                    </button>
                </div>

                <div class="bubble-body" id="chat-stream">
                    <div class="welcome-msg" id="chat-welcome">
                        🐶 <b>Xin chào Chủ nhân!</b> Em đang ở đây, sẵn sàng hỗ
                        trợ ạ! Chủ nhân hãy nhấp vào ô chat để bắt đầu nhé!
                    </div>
                </div>

                <div class="bubble-footer">
                    <!-- Chip gợi ý được JS dựng động theo tần suất từ khóa hỏi đáp -->
                    <div class="smart-suggestions" id="smart-chips"></div>
                    <div class="input-wrapper">
                        <!-- Nút dấu + đính kèm hình ảnh, tài liệu (tách biệt hoàn toàn với input type file) -->
                        <input
                            type="file"
                            id="file-upload-input"
                            class="hidden-file-input"
                            accept="image/*,.pdf,.txt,.md,.nix,.json,.yaml,.yml,.sh,.go,.py,.csv"
                        />
                        <button
                            type="button"
                            id="btn-attach"
                            class="attach-btn"
                            title="Thêm hình ảnh, tài liệu (+)"
                        >
                            <svg
                                width="15"
                                height="15"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2.6"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <line x1="12" y1="5" x2="12" y2="19"></line>
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                            </svg>
                        </button>
                        <input
                            type="text"
                            id="chat-input"
                            placeholder="Hỏi em, dán link hoặc chạy lệnh... (Enter)"
                            autocomplete="off"
                        />
                        <button
                            id="btn-send"
                            class="send-btn"
                            title="Gửi câu hỏi"
                        >
                            ➤
                        </button>
                    </div>
                </div>
                <div class="bubble-tail"></div>
            </div>
