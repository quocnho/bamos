[package]
name = "bamos-assistant"
version = "0.1.0"
edition = "2021"
description = "BamOS Elegant Floating AI Assistant (Deepin style)"

[dependencies]
gtk4 = "0.9"
libadwaita = { version = "0.7", features = ["v1_4"] }
glib = "0.20"
gio = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
async-channel = "2.5.0"
