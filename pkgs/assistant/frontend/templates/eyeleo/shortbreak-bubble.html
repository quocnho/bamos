<!-- 2. Bong bóng Nghỉ Ngắn (Short Break - 8s) với Cún làm mẫu bài tập mắt -->
<div id="eyeleo-shortbreak-bubble" class="bubble eyeleo-bubble eyeleo-shortbreak hidden">
    <div class="bubble-header">
        <div class="assistant-tag">
            <span class="eyeleo-badge short">👀 Nghỉ Ngắn 20-20-20</span>
            <span class="status-text" id="shortbreak-exercise-name">Chớp mắt liên tục</span>
        </div>
        <button id="btn-shortbreak-skip" class="icon-btn close-btn" title="Bỏ qua">×</button>
    </div>
    <div class="bubble-body eyeleo-body">
        <div class="exercise-guide-box">
            <div class="exercise-icon" id="shortbreak-icon">👀</div>
            <div class="exercise-text" id="shortbreak-instruction">
                Chủ nhân hãy nhìn theo mắt em và chớp mắt liên tục để giữ ẩm màng mắt nhé!
            </div>
        </div>
        <div class="eyeleo-timer-bar-wrapper">
            <div class="eyeleo-timer-bar" id="shortbreak-progress"></div>
            <span class="eyeleo-seconds-num" id="shortbreak-countdown">8s</span>
        </div>
    </div>
    <div class="bubble-tail"></div>
</div>
