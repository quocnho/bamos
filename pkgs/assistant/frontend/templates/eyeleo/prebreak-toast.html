<!-- 1. Thông báo trước 30 giây khi sắp đến nghỉ dài (Pre-break Notification) -->
<div id="eyeleo-prebreak-toast" class="eyeleo-prebreak-toast hidden">
    <div class="prebreak-icon">⏰</div>
    <div class="prebreak-content">
        <div class="prebreak-title">Sắp đến giờ Nghỉ Dài!</div>
        <div class="prebreak-text">
            Còn <b id="prebreak-seconds">30</b> giây nữa sẽ bắt đầu nghỉ 5 phút. Chủ nhân hãy kịp lưu công việc và dòng code nhé!
        </div>
    </div>
    <button id="btn-prebreak-dismiss" class="prebreak-close">×</button>
</div>
