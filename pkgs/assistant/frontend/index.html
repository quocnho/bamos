<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BamOS Mascot AI Assistant & EyeLeo Companion</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="state-sleeping">
  <div id="app-container">
    
    <!-- Bong bóng nhắc nhở sức khỏe EyeLeo (Nghỉ mắt, Uống nước, Vươn vai) -->
    <div id="eyeleo-bubble" class="bubble eyeleo-bubble hidden">
      <div class="bubble-header">
        <div class="assistant-tag">
          <span class="eyeleo-badge" id="eyeleo-type-badge">💧 Uống Nước</span>
          <span class="status-text" id="eyeleo-timer-label">Đến giờ rồi!</span>
        </div>
        <button id="btn-eyeleo-dismiss" class="icon-btn close-btn" title="Bỏ qua">×</button>
      </div>
      <div class="bubble-body eyeleo-body">
        <div class="eyeleo-icon" id="eyeleo-icon">💧</div>
        <div class="eyeleo-msg" id="eyeleo-msg">
          Chủ nhân đã làm việc liên tục rồi! Hãy uống một ngụm nước và vươn vai thư giãn 1 phút nhé!
        </div>
        <div class="eyeleo-countdown" id="eyeleo-countdown">60s</div>
      </div>
      <div class="eyeleo-actions">
        <button id="btn-eyeleo-done" class="eyeleo-btn primary">Đã làm xong 👍</button>
        <button id="btn-eyeleo-snooze" class="eyeleo-btn secondary">Nhắc lại sau 5p</button>
      </div>
      <div class="bubble-tail"></div>
    </div>

    <!-- Bong bóng hội thoại AI Chat & RAG -->
    <div id="speech-bubble" class="bubble hidden">
      <div class="bubble-header" data-drag="true">
        <div class="assistant-tag">
          <span class="rag-indicator" id="rag-badge" title="RAG Tri thức nội bộ">📚 RAG</span>
          <span class="status-text" id="status-label">Đang ngủ ngoan...</span>
        </div>
        <div class="window-controls">
          <button id="btn-eyeleo-toggle" class="icon-btn active" title="Bật/Tắt nhắc EyeLeo (mắt/nước)">⏰</button>
          <button id="btn-sleep-cún" class="icon-btn" title="Cho cún đi ngủ">💤</button>
          <button id="btn-minimize" class="icon-btn" title="Thu nhỏ bong bóng">−</button>
          <button id="btn-close" class="icon-btn close-btn" title="Ẩn cún cưng">×</button>
        </div>
      </div>

      <div class="bubble-body" id="chat-stream">
        <div class="welcome-msg" id="chat-welcome">
          Gâu gâu! Em là trợ lý cún cưng BamOS kiêm bạn đồng hành sức khỏe EyeLeo. Nhấp vào em để trò chuyện hoặc cứ để em nhắc chủ nhân nghỉ mắt nhé!
        </div>
      </div>

      <div class="bubble-footer">
        <div class="smart-suggestions" id="smart-chips">
          <button class="chip" data-query="Tìm file .nix">🔍 Tìm file .nix</button>
          <button class="chip" data-query="Đọc file /etc/nixos/configuration.nix">📄 Đọc config</button>
          <button class="chip" data-query="Tìm file trong Documents">📁 Documents</button>
        </div>
        <div class="input-wrapper">
          <input 
            type="text" 
            id="chat-input" 
            placeholder="Hỏi cún cưng... (Enter để gửi)" 
            autocomplete="off"
          />
          <button id="btn-rag-toggle" class="toggle-btn active" title="Bật/Tắt RAG Tri Thức">
            📚
          </button>
          <button id="btn-send" class="send-btn" title="Gửi câu hỏi">
            ➤
          </button>
        </div>
      </div>
      <div class="bubble-tail"></div>
    </div>

    <!-- Chú cún con Mascot (Rover Puppy) có thể kéo thả di chuyển -->
    <div id="pet-wrapper" class="pet-draggable" title="Kéo để di chuyển • Bấm để đánh thức AI / vuốt ve">
      <div id="heart-burst" class="heart-effect">❤️</div>
      <div id="zzz-bubble" class="zzz-effect">z Z Z</div>
      
      <!-- Chú cún SVG động tương tác -->
      <svg id="puppy-svg" viewBox="0 0 200 220" width="160" height="176">
        <defs>
          <linearGradient id="furGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFD166" />
            <stop offset="100%" stop-color="#F4A261" />
          </linearGradient>
          <linearGradient id="earGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#E76F51" />
            <stop offset="100%" stop-color="#D94E34" />
          </linearGradient>
          <linearGradient id="bellyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#FFFDF7" />
            <stop offset="100%" stop-color="#FFE7C4" />
          </linearGradient>
          <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
            <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="rgba(0,0,0,0.3)" />
          </filter>
        </defs>

        <!-- Bóng dưới chân cún -->
        <ellipse cx="100" cy="205" rx="65" ry="12" fill="rgba(0, 0, 0, 0.25)" class="puppy-shadow" />

        <!-- Cái đuôi ngoe nguẩy -->
        <g class="tail-group">
          <path d="M 145 165 C 175 160, 185 130, 175 110 C 168 115, 160 135, 145 155 Z" fill="url(#earGrad)" />
          <circle cx="174" cy="112" r="7" fill="#FFE7C4" />
        </g>

        <!-- Chân sau -->
        <ellipse cx="58" cy="188" rx="20" ry="13" fill="#E76F51" />
        <ellipse cx="142" cy="188" rx="20" ry="13" fill="#E76F51" />

        <!-- Thân mình chú cún -->
        <g class="body-group">
          <path d="M 60 120 C 50 170, 60 195, 100 195 C 140 195, 150 170, 140 120 C 130 95, 70 95, 60 120 Z" 
                fill="url(#furGrad)" filter="url(#softShadow)" />
          <!-- Đốm yếm bụng màu kem -->
          <path d="M 80 135 C 75 165, 80 188, 100 188 C 120 188, 125 165, 120 135 C 115 125, 85 125, 80 135 Z" 
                fill="url(#bellyGrad)" />
        </g>

        <!-- Chân trước -->
        <g class="front-paws">
          <path d="M 75 165 L 75 198 A 10 8 0 0 0 95 198 L 95 165 Z" fill="url(#furGrad)" />
          <circle cx="85" cy="198" r="8" fill="#FFFDF7" />
          
          <path d="M 105 165 L 105 198 A 10 8 0 0 0 125 198 L 125 165 Z" fill="url(#furGrad)" />
          <circle cx="115" cy="198" r="8" fill="#FFFDF7" />
        </g>

        <!-- Vòng cổ màu xanh công nghệ BamOS kèm chuông vàng -->
        <path d="M 70 115 Q 100 130 130 115 Q 100 122 70 115" fill="#2A9D8F" stroke="#264653" stroke-width="2" />
        <circle cx="100" cy="123" r="6" fill="#F4A261" stroke="#E76F51" stroke-width="1.5" class="bell" />

        <!-- Đầu chú cún -->
        <g class="head-group">
          <!-- Tai trái -->
          <path class="ear ear-left" d="M 68 55 C 30 50, 20 95, 38 120 C 48 125, 58 100, 68 75 Z" fill="url(#earGrad)" />
          <!-- Tai phải -->
          <path class="ear ear-right" d="M 132 55 C 170 50, 180 95, 162 120 C 152 125, 142 100, 132 75 Z" fill="url(#earGrad)" />

          <!-- Khối mặt đầu -->
          <ellipse cx="100" cy="72" rx="46" ry="40" fill="url(#furGrad)" filter="url(#softShadow)" />

          <!-- Mõm chú cún -->
          <ellipse cx="100" cy="85" rx="26" ry="20" fill="url(#bellyGrad)" />

          <!-- Mắt trái -->
          <g class="eye eye-left">
            <ellipse cx="80" cy="65" rx="8" ry="11" fill="#264653" class="eyeball" />
            <circle cx="78" cy="61" r="3.5" fill="#FFFFFF" class="pupil" />
            <circle cx="83" cy="69" r="1.5" fill="#FFFFFF" />
          </g>

          <!-- Mắt phải -->
          <g class="eye eye-right">
            <ellipse cx="120" cy="65" rx="8" ry="11" fill="#264653" class="eyeball" />
            <circle cx="118" cy="61" r="3.5" fill="#FFFFFF" class="pupil" />
            <circle cx="123" cy="69" r="1.5" fill="#FFFFFF" />
          </g>

          <!-- Mũi đen bóng -->
          <path d="M 94 80 Q 100 76 106 80 Q 100 89 94 80 Z" fill="#264653" />
          <ellipse cx="98" cy="79" rx="2" ry="1" fill="#FFFFFF" opacity="0.8" />

          <!-- Miệng / Lưỡi -->
          <g class="mouth-group">
            <path class="mouth-line" d="M 93 86 Q 100 91 107 86" stroke="#264653" stroke-width="2" fill="none" stroke-linecap="round" />
            <path class="tongue" d="M 96 88 C 96 98, 104 98, 104 88 Z" fill="#E63946" />
          </g>

          <!-- Má hồng -->
          <circle cx="65" cy="78" r="6" fill="#F4A261" opacity="0.6" />
          <circle cx="135" cy="78" r="6" fill="#F4A261" opacity="0.6" />
        </g>
      </svg>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
