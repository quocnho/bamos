<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BamOS 3D Mascot AI Assistant & EyeLeo Companion</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="state-welcoming">
  <div id="app-container">
    
    <!-- Bong bóng nhắc nhở sức khỏe EyeLeo (Nghỉ mắt, Uống nước, Vươn vai) -->
    <div id="eyeleo-bubble" class="bubble eyeleo-bubble hidden">
      <div class="bubble-header">
        <div class="assistant-tag">
          <span class="eyeleo-badge" id="eyeleo-type-badge">💧 Uống Nước</span>
          <span class="status-text" id="eyeleo-timer-label">Đến giờ rồi!</span>
        </div>
        <button id="btn-eyeleo-dismiss" class="icon-btn close-btn" title="Bỏ qua">×</button>
      </div>
      <div class="bubble-body eyeleo-body">
        <div class="eyeleo-icon" id="eyeleo-icon">💧</div>
        <div class="eyeleo-msg" id="eyeleo-msg">
          Chủ nhân đã làm việc liên tục rồi! Hãy uống một ngụm nước và vươn vai thư giãn 1 phút nhé!
        </div>
        <div class="eyeleo-countdown" id="eyeleo-countdown">60s</div>
      </div>
      <div class="eyeleo-actions">
        <button id="btn-eyeleo-done" class="eyeleo-btn primary">Đã làm xong 👍</button>
        <button id="btn-eyeleo-snooze" class="eyeleo-btn secondary">Nhắc lại sau 5p</button>
      </div>
      <div class="bubble-tail"></div>
    </div>

    <!-- Bong bóng hội thoại AI Chat & RAG -->
    <div id="speech-bubble" class="bubble">
      <div class="bubble-header" data-drag="true">
        <div class="assistant-tag">
          <span class="rag-indicator" id="rag-badge" title="RAG Tri thức nội bộ">📚 RAG</span>
          <span class="status-text" id="status-label">Em chào Chủ nhân!</span>
        </div>
        <div class="window-controls">
          <button id="btn-eyeleo-toggle" class="icon-btn active" title="Bật/Tắt nhắc EyeLeo (mắt/nước)">⏰</button>
          <button id="btn-sleep-cún" class="icon-btn" title="Cho cún ngủ canh nhà">💤</button>
          <button id="btn-minimize" class="icon-btn" title="Thu nhỏ bong bóng">−</button>
          <button id="btn-close" class="icon-btn close-btn" title="Ẩn cún cưng">×</button>
        </div>
      </div>

      <!-- Thanh bối cảnh Cục Xương (Directory Context Bar) -->
      <div id="bone-context-bar" class="bone-context-bar hidden">
        <div class="bone-context-info">
          <span class="bone-icon">🍖</span>
          <span class="bone-text" id="bone-dir-text">/etc/nixos</span>
        </div>
        <button id="btn-clear-bone" class="bone-clear-btn" title="Gỡ bỏ bối cảnh thư mục">×</button>
      </div>

      <div class="bubble-body" id="chat-stream">
        <div class="welcome-msg" id="chat-welcome">
          🐶 <b>Xin chào Chủ nhân!</b> Em đang ở đây, sẵn sàng hỗ trợ ạ! Chủ nhân hãy nhấp vào ô chat để bắt đầu nhé!
        </div>
      </div>

      <div class="bubble-footer">
        <div class="smart-suggestions" id="smart-chips">
          <button class="chip" data-query="Thông tin phần cứng hệ thống">💻 Phần cứng</button>
          <button class="chip" data-query="Đang chạy những ứng dụng nào">⚡ Ứng dụng chạy</button>
          <button class="chip" data-query="Thống kê số lượng tập tin nix">📊 Thống kê .nix</button>
          <button class="chip" data-query="Tìm file .nix">🔍 Tìm file .nix</button>
          <button class="chip" data-query="Đọc file /etc/nixos/configuration.nix">📄 Đọc config</button>
        </div>
        <div class="input-wrapper">
          <input 
            type="text" 
            id="chat-input" 
            placeholder="Nói chuyện cùng em... (Enter để gửi)" 
            autocomplete="off"
          />
          <button id="btn-rag-toggle" class="toggle-btn active" title="Bật/Tắt RAG Tri Thức">
            📚
          </button>
          <button id="btn-send" class="send-btn" title="Gửi câu hỏi">
            ➤
          </button>
        </div>
      </div>
      <div class="bubble-tail"></div>
    </div>

    <!-- Chú cún con Mascot 3D Chibi (Original BamOS Mascot) -->
    <div id="pet-wrapper" class="pet-draggable" title="Kéo để di chuyển • Bấm để trò chuyện cùng em">
      <div id="heart-burst" class="heart-effect">❤️</div>
      <div id="zzz-bubble" class="zzz-effect">z Z Z</div>
      
      <!-- Chú cún 3D Vector SVG Đa Tầng -->
      <svg id="puppy-svg" viewBox="0 0 220 220" width="170" height="170">
        <defs>
          <!-- Gradient 3D mặt và thân -->
          <radialGradient id="grad3DFace" cx="40%" cy="35%" r="65%">
            <stop offset="0%" stop-color="#FFEAA7" />
            <stop offset="50%" stop-color="#FDCB6E" />
            <stop offset="85%" stop-color="#E17055" />
            <stop offset="100%" stop-color="#D63031" />
          </radialGradient>

          <radialGradient id="grad3DBody" cx="35%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#FFEAA7" />
            <stop offset="60%" stop-color="#FDCB6E" />
            <stop offset="90%" stop-color="#E17055" />
            <stop offset="100%" stop-color="#C0392B" />
          </radialGradient>

          <!-- Gradient tai mềm 3D -->
          <linearGradient id="grad3DEar" x1="20%" y1="0%" x2="80%" y2="100%">
            <stop offset="0%" stop-color="#E17055" />
            <stop offset="60%" stop-color="#D63031" />
            <stop offset="100%" stop-color="#8E1A1A" />
          </linearGradient>

          <!-- Gradient má phúng phính -->
          <radialGradient id="grad3DMuzzle" cx="50%" cy="35%" r="55%">
            <stop offset="0%" stop-color="#FFFFFF" />
            <stop offset="65%" stop-color="#FFFDF0" />
            <stop offset="100%" stop-color="#FEEAA0" />
          </radialGradient>

          <!-- Gradient mắt ngọc hổ phách 3D -->
          <radialGradient id="grad3DIris" cx="45%" cy="40%" r="55%">
            <stop offset="0%" stop-color="#8B4513" />
            <stop offset="45%" stop-color="#5C2C16" />
            <stop offset="80%" stop-color="#2D150B" />
            <stop offset="100%" stop-color="#120703" />
          </radialGradient>

          <!-- Gradient chuông vàng kim loại 3D -->
          <radialGradient id="grad3DBell" cx="35%" cy="30%" r="60%">
            <stop offset="0%" stop-color="#FFF9D2" />
            <stop offset="45%" stop-color="#F1C40F" />
            <stop offset="85%" stop-color="#D35400" />
            <stop offset="100%" stop-color="#7E3200" />
          </radialGradient>

          <!-- Đổ bóng mềm dưới đất -->
          <radialGradient id="gradGroundShadow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="rgba(0,0,0,0.35)" />
            <stop offset="60%" stop-color="rgba(0,0,0,0.18)" />
            <stop offset="100%" stop-color="rgba(0,0,0,0)" />
          </radialGradient>
        </defs>

        <!-- Bóng đổ sàn 3D -->
        <ellipse cx="110" cy="204" rx="72" ry="12" fill="url(#gradGroundShadow)" class="puppy-shadow" />

        <!-- Đuôi vẫy 3D -->
        <g class="tail-group">
          <path d="M 152 165 C 185 155, 198 120, 185 98 C 176 104, 168 128, 150 152 Z" fill="url(#grad3DEar)" />
          <circle cx="184" cy="100" r="8" fill="#FFFDF0" />
        </g>

        <!-- Chân sau nằm canh nhà -->
        <ellipse cx="58" cy="190" rx="22" ry="14" fill="url(#grad3DEar)" class="back-paw-left" />
        <ellipse cx="162" cy="190" rx="22" ry="14" fill="url(#grad3DEar)" class="back-paw-right" />

        <!-- Thân mình 3D Chibi -->
        <g class="body-group">
          <path d="M 64 125 C 50 170, 62 198, 110 198 C 158 198, 170 170, 156 125 C 144 98, 76 98, 64 125 Z" 
                fill="url(#grad3DBody)" />
          <!-- Yếm ngực kem mềm mại -->
          <path d="M 86 138 C 80 168, 86 190, 110 190 C 134 190, 140 168, 134 138 C 128 126, 92 126, 86 138 Z" 
                fill="url(#grad3DMuzzle)" opacity="0.95" />
        </g>

        <!-- Chân trước 3D (Tư thế đứng hoặc nằm duỗi canh nhà) -->
        <g class="front-paws">
          <g class="paw-left">
            <ellipse cx="86" cy="195" rx="14" ry="9" fill="url(#grad3DFace)" />
            <ellipse cx="86" cy="196" rx="10" ry="6" fill="#FFFDF0" />
            <!-- Móng vuốt nhỏ xinh -->
            <circle cx="80" cy="199" r="1.8" fill="#E17055" />
            <circle cx="86" cy="201" r="1.8" fill="#E17055" />
            <circle cx="92" cy="199" r="1.8" fill="#E17055" />
          </g>
          <g class="paw-right">
            <ellipse cx="134" cy="195" rx="14" ry="9" fill="url(#grad3DFace)" />
            <ellipse cx="134" cy="196" rx="10" ry="6" fill="#FFFDF0" />
            <circle cx="128" cy="199" r="1.8" fill="#E17055" />
            <circle cx="134" cy="201" r="1.8" fill="#E17055" />
            <circle cx="140" cy="199" r="1.8" fill="#E17055" />
          </g>
        </g>

        <!-- Vòng cổ BamOS xanh ngọc 3D -->
        <path d="M 72 118 Q 110 134 148 118 Q 110 126 72 118" fill="#00CEC9" stroke="#00A8A4" stroke-width="2.5" />
        <!-- Chuông vàng kim loại 3D với khe chuông -->
        <circle cx="110" cy="128" r="8.5" fill="url(#grad3DBell)" class="bell" />
        <circle cx="110" cy="130" r="1.8" fill="#5C2C16" />

        <!-- Đầu chú cún 3D Chibi -->
        <g class="head-group">
          <!-- Tai trái mềm mại rủ xuống -->
          <path class="ear ear-left" d="M 66 52 C 22 45, 12 100, 36 128 C 48 135, 58 106, 68 76 Z" fill="url(#grad3DEar)" />
          <!-- Tai phải mềm mại rủ xuống -->
          <path class="ear ear-right" d="M 154 52 C 198 45, 208 100, 184 128 C 172 135, 162 106, 152 76 Z" fill="url(#grad3DEar)" />

          <!-- Khối mặt cầu 3D tròn xoe dễ thương -->
          <ellipse cx="110" cy="74" rx="52" ry="46" fill="url(#grad3DFace)" />
          
          <!-- Điểm sáng bóng highlight trên trán tạo cảm giác 3D nổi -->
          <ellipse cx="96" cy="48" rx="18" ry="10" fill="#FFFFFF" opacity="0.35" transform="rotate(-15, 96, 48)" />

          <!-- Mõm chú cún tròn trịa mềm mại -->
          <ellipse cx="110" cy="88" rx="30" ry="22" fill="url(#grad3DMuzzle)" />

          <!-- MẮT TRÁI 3D (Có thể thức hoặc nhắm mắt ngủ canh nhà) -->
          <g class="eye-container eye-left-container">
            <!-- Mắt mở tròn xoe long lanh -->
            <g class="eye-open eye-left">
              <ellipse cx="88" cy="68" rx="11" ry="14" fill="url(#grad3DIris)" />
              <!-- Đốm sáng phản chiếu 3 tầng cực kỳ long lanh -->
              <circle cx="85" cy="62" r="4.5" fill="#FFFFFF" />
              <circle cx="92" cy="74" r="2.2" fill="#FFFFFF" />
              <circle cx="83" cy="73" r="1.2" fill="#FFFFFF" />
            </g>
            <!-- Mí mắt và Lông mi cong vút khi ngủ -->
            <g class="eye-closed eye-left-closed">
              <!-- Cung mí mắt cong mềm mại -->
              <path d="M 76 72 Q 88 82 100 72" stroke="#8B4513" stroke-width="3" stroke-linecap="round" fill="none" />
              <!-- Hàng lông mi cong vút đáng yêu -->
              <path d="M 77 71 Q 72 65 71 61" stroke="#5C2C16" stroke-width="2" stroke-linecap="round" fill="none" class="eyelash" />
              <path d="M 85 75 Q 83 67 81 63" stroke="#5C2C16" stroke-width="2" stroke-linecap="round" fill="none" class="eyelash" />
              <path d="M 94 75 Q 95 67 96 63" stroke="#5C2C16" stroke-width="2" stroke-linecap="round" fill="none" class="eyelash" />
              <path d="M 99 71 Q 104 65 106 61" stroke="#5C2C16" stroke-width="2" stroke-linecap="round" fill="none" class="eyelash" />
            </g>
          </g>

          <!-- MẮT PHẢI 3D -->
          <g class="eye-container eye-right-container">
            <!-- Mắt mở tròn xoe long lanh -->
            <g class="eye-open eye-right">
              <ellipse cx="132" cy="68" rx="11" ry="14" fill="url(#grad3DIris)" />
              <circle cx="129" cy="62" r="4.5" fill="#FFFFFF" />
              <circle cx="136" cy="74" r="2.2" fill="#FFFFFF" />
              <circle cx="127" cy="73" r="1.2" fill="#FFFFFF" />
            </g>
            <!-- Mí mắt và Lông mi cong vút khi ngủ -->
            <g class="eye-closed eye-right-closed">
              <path d="M 120 72 Q 132 82 144 72" stroke="#8B4513" stroke-width="3" stroke-linecap="round" fill="none" />
              <path d="M 121 71 Q 116 65 114 61" stroke="#5C2C16" stroke-width="2" stroke-linecap="round" fill="none" class="eyelash" />
              <path d="M 126 75 Q 125 67 124 63" stroke="#5C2C16" stroke-width="2" stroke-linecap="round" fill="none" class="eyelash" />
              <path d="M 135 75 Q 137 67 139 63" stroke="#5C2C16" stroke-width="2" stroke-linecap="round" fill="none" class="eyelash" />
              <path d="M 143 71 Q 148 65 150 61" stroke="#5C2C16" stroke-width="2" stroke-linecap="round" fill="none" class="eyelash" />
            </g>
          </g>

          <!-- Mũi đen bóng 3D có vệt sáng bóng -->
          <path d="M 103 82 Q 110 78 117 82 Q 110 93 103 82 Z" fill="#2D150B" />
          <ellipse cx="107" cy="81" rx="2.5" ry="1.2" fill="#FFFFFF" opacity="0.85" />

          <!-- Miệng / Lưỡi hồng và Cục Xương ngậm trong miệng -->
          <g class="mouth-group">
            <path class="mouth-line" d="M 102 90 Q 110 95 118 90" stroke="#5C2C16" stroke-width="2.2" fill="none" stroke-linecap="round" />
            <path class="tongue" d="M 106 92 C 106 102, 114 102, 114 92 Z" fill="#FF7675" />
            <!-- Cục xương 3D nhỏ ngậm ngang miệng chú cún khi có bối cảnh thư mục -->
            <g id="mouth-bone" class="mouth-bone hidden" transform="translate(86, 86) rotate(-8, 24, 8)">
              <!-- Khối cục xương 3D ngà vàng viền nâu cam -->
              <path d="M 10 5 C 10 1, 4 1, 4 5 C 1 5, 1 11, 4 11 C 4 15, 10 15, 10 11 L 38 11 C 38 15, 44 15, 44 11 C 47 11, 47 5, 44 5 C 44 1, 38 1, 38 5 Z" 
                    fill="#FFFDF0" stroke="#E17055" stroke-width="1.8" stroke-linejoin="round" />
              <!-- Highlight sáng 3D trên thân xương -->
              <rect x="12" y="6.5" width="24" height="2.5" rx="1.2" fill="#FFFFFF" opacity="0.9" />
            </g>
          </g>

          <!-- Má hồng ửng đào 3D đáng yêu -->
          <ellipse cx="70" cy="82" rx="7.5" ry="5.5" fill="#FF7675" opacity="0.5" />
          <ellipse cx="150" cy="82" rx="7.5" ry="5.5" fill="#FF7675" opacity="0.5" />
        </g>
      </svg>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
