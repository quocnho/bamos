<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>BamOS 3D Mascot AI Assistant & EyeLeo Companion</title>
        <link rel="stylesheet" href="style.css" />
        <link rel="stylesheet" href="style-settings.css" />
    </head>
    <body class="state-welcoming">
        <div id="app-container">
            <!-- 
                Các component giao diện (EyeLeo, Chat bubble, Mascot pet, Modals)
                được chia tách theo module chuyên nghiệp trong thư mục templates/
                và được nạp tự động qua template-loader.js khi khởi động ứng dụng.
            -->

            <!-- Tooltip cho chip từ khóa: đặt ngoài .bubble để không bị overflow:hidden cắt -->
            <div id="chip-tooltip" class="chip-tooltip hidden"></div>

            <!-- Menu sổ xuống của nút Thiết lập ⚙ (đặt ngoài .bubble để không bị cắt) -->
            <div id="settings-menu" class="settings-menu hidden">
                <button class="settings-menu-item" data-panel="rag">
                    <span class="smi-icon">📚</span>
                    <span class="smi-text">
                        <b>RAG — Tri thức</b>
                        <small>Nạp tài liệu, xưng hô, số đoạn tri thức</small>
                    </span>
                </button>
                <button class="settings-menu-item" data-panel="llm">
                    <span class="smi-icon">🧠</span>
                    <span class="smi-text">
                        <b>LLM / SLM</b>
                        <small>Chọn model cục bộ hoặc API đám mây</small>
                    </span>
                </button>
                <button class="settings-menu-item" data-panel="eyeleo">
                    <span class="smi-icon">⏰</span>
                    <span class="smi-text">
                        <b>Quản lý nghỉ ngơi</b>
                        <small>Nhắc nghỉ mắt 20-20-20 và nghỉ dài</small>
                    </span>
                </button>
                <button class="settings-menu-item" data-panel="system">
                    <span class="smi-icon">🛡️</span>
                    <span class="smi-text">
                        <b>Giám sát Hệ thống & NixOS</b>
                        <small>Quét log, cấu hình /etc/nixos, app ngầm</small>
                    </span>
                </button>
                <button class="settings-menu-item" data-panel="waka">
                    <span class="smi-icon">📊</span>
                    <span class="smi-text">
                        <b>WakaTracker & Năng suất</b>
                        <small>Thời gian làm việc, biểu đồ, lịch nhắc việc</small>
                    </span>
                </button>
                <button class="settings-menu-item" data-panel="profile">
                    <span class="smi-icon">👤</span>
                    <span class="smi-text">
                        <b>Hồ sơ & Đánh giá Năng lực</b>
                        <small>Đăng ký hỗ trợ, quiz xếp level, lộ trình học</small>
                    </span>
                </button>
                <button class="settings-menu-item" data-panel="embed">
                    <span class="smi-icon">🌐</span>
                    <span class="smi-text">
                        <b>Nhúng Web Widget & Whitelist</b>
                        <small>Cổng, giao diện, whitelist domain nhúng</small>
                    </span>
                </button>
                <button class="settings-menu-item" data-panel="about">
                    <span class="smi-icon">ℹ️</span>
                    <span class="smi-text">
                        <b>Giới thiệu</b>
                        <small>BamAI — package của BamOS</small>
                    </span>
                </button>
            </div>
        </div>

        <!-- Nạp ứng dụng dạng ES module: điểm vào duy nhất là js/main.js -->
        <script type="module" src="js/main.js"></script>
    </body>
</html>
