# Bamos — Calamares welcome module.
# Bắt buộc có mạng (nixos-install --flake cần tải github:quocnho/bamos + nixpkgs).
showReleaseNotesUrl: false

requirements:
    requiredStorage: 10
    requiredRam: 3.0

    internetCheckUrl: [ https://github.com, https://cache.nixos.org/ ]

    check:
        - storage
        - ram
        - power
        - internet
        - screen

    required:
        - storage
        - ram
        - internet
