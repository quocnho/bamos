# Bamos — Calamares partition module (tham khảo calamares-nixos-extensions)
# GPT/EFI: ESP 1GiB mount /boot + root ext4 chiếm phần còn lại.
efi:
    mountPoint: "/boot"
    recommendedSize: 1GiB
    minimumSize: 32MiB
    label: "BAMOS-EFI"

userSwapChoices:
    - none
    - small
    - suspend

luksGeneration: luks2

defaultFileSystemType: "btrfs"

availableFileSystemTypes:
    - ext4
    - btrfs
    - xfs
    - f2fs

showNotEncryptedBootMessage: false

partitionLayout:
    - name: "root"
      filesystem: "unknown"
      noEncrypt: false
      mountPoint: "/"
      size: 100%
