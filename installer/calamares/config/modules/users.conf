# Bamos — Calamares users module.
# User được ghi vào configuration.nix (bước Users → global storage → module nixos);
# máy đích tự tạo user ở lần boot đầu qua initialPassword (nhớ đổi mật khẩu).
# Mật khẩu root để trống (nixos-install --no-root-passwd).
defaultGroups:
    - networkmanager
    - wheel

setRootPassword: false
doReusePassword: true
doAutologin: false

# Cho phép mật khẩu ngắn — người dùng có thể đổi sau khi cài
passwordRequirements:
    minLength: 1
    maxLength: 64
    libpwquality:
        - minlen=1
        - maxrepeat=3
        - badwords=bamos,nixos,linux

allowWeakPasswords: true
allowWeakPasswordsDefault: true

user:
  shell: /run/current-system/sw/bin/zsh
  forbidden_names: [ root ]

hostname:
  location: None
  writeHostsFile: false
  forbidden_names: [ localhost ]
