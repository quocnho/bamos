# Bamos — Calamares packagechooser: chọn LOẠI MÁY (laptop/desktop).
# Giá trị được lưu vào global storage `packagechooser_device` → module nixos
# đọc để sinh cấu hình quản lý năng lượng (my.power) trong configuration.nix.
#
# Phần lớn người dùng dùng DESKTOP nên đặt mặc định là desktop — không bật
# TLP/suspend sâu (s2idle)/thermald vốn chỉ cần cho máy xách tay dùng pin.
mode: required

method: legacy

labels:
    step: "Loại máy"

default: desktop

items:
    - id: laptop
      name: "Laptop (xách tay)"
      description: "<html>Bật <b>quản lý năng lượng</b>: TLP (tiết kiệm pin, sạc 80%),\n                    suspend nông (s2idle), thermald (quản nhiệt) và xử lý nắp máy.</html>"

    - id: desktop
      name: "Desktop (máy bàn)"
      description: "<html>Không cần quản lý pin — dùng nguồn điện liên tục.\n                    Bamos giữ nguyên mặc định của GNOME.</html>"
