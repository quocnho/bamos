# Bamos — Calamares packagechooser: chọn cấu hình GPU (như GLF-OS chọn edition).
# Giá trị được lưu vào global storage `packagechooser_gpu` → module nixos đọc
# để sinh cấu hình GPU trong configuration.nix của máy đích.
mode: required

method: legacy

labels:
    step: "Cấu hình GPU"

default: auto

items:
    - id: auto
      name: "Tự động (đề xuất)"
      description: "<html>Tự dò card đồ họa bằng <b>lspci</b>.<br/>
                    Máy NVIDIA Optimus (Intel + NVIDIA) sẽ được bật driver
                    NVIDIA kèm PRIME offload — giống máy của tác giả.</html>"

    - id: nvidia
      name: "NVIDIA"
      description: "<html>Ép dùng driver NVIDIA.<br/>
                    Laptop NVIDIA + Intel → cấu hình Optimus đầy đủ.
                    Máy chỉ có card NVIDIA → bật driver đơn.</html>"

    - id: intel
      name: "Chỉ Intel"
      description: "<html>Chỉ dùng iGPU Intel (driver mặc định của kernel).
                    Phù hợp máy không có card rời hoặc muốn tiết kiệm pin.</html>"

# bamos installer
